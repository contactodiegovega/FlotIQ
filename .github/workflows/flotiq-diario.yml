
name: FLOTIQ - Planificacion diaria

on:
  schedule:
    - cron: "17 10 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flotiq-diario
  cancel-in-progress: false

jobs:
  planificar:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      TZ: Europe/Madrid
      PYTHONUNBUFFERED: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"

    steps:
      # 1. Descargar codigo
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # 2. Preparar credenciales privadas
      - name: Configurar variables privadas
        shell: bash
        env:
          FLOTIQ_ENV: ${{ secrets.FLOTIQ_ENV }}
        run: |
          if [ -z "$FLOTIQ_ENV" ]; then
            echo "::error::Falta el secreto FLOTIQ_ENV en GitHub"
            exit 1
          fi

          printf '%s\n' "$FLOTIQ_ENV" > .env
          chmod 600 .env
          echo "Variables privadas configuradas"

      # 3. Preparar Python
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

     
      # 4. Instalar dependencias compatibles con Linux
      - name: Instalar dependencias
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y coinor-cbc

          python - <<'PY'
          from pathlib import Path

          origen = Path("requirements.txt")
          destino = Path("/tmp/flotiq-requirements-linux.txt")

          contenido = origen.read_bytes()

          # Detectar UTF-16 o UTF-8 automáticamente
          if contenido.startswith((b"\xff\xfe", b"\xfe\xff")):
              texto = contenido.decode("utf-16")
          else:
              texto = contenido.decode("utf-8-sig")

          # Eliminar dependencias exclusivas de Windows
          incompatibles = (
              "pywinpty",
              "pywin32",
              "pywin32-ctypes",
          )

          compatibles = [
              linea
              for linea in texto.splitlines()
              if not linea.strip().lower().startswith(incompatibles)
          ]

          destino.write_text(
              "\n".join(compatibles) + "\n",
              encoding="utf-8",
          )

          print("Requirements convertidos a UTF-8")
          print("Dependencias Windows excluidas")
          print("Paquetes preparados:", len(compatibles))
          PY

          python -m pip install --upgrade pip

          python -m pip install \
            -r /tmp/flotiq-requirements-linux.txt \
            "pulp>=4,<5" \
            "psycopg2-binary>=2.9,<3"

      # 5. Comprobar imports y CBC
      - name: Verificar entorno
        shell: bash
        run: |
          python -m compileall -q backend

          python - <<'PY'
          import importlib
          import pulp

          modulos = [
              "backend.actualizar_precios",
              "backend.prediccion_48h",
              "backend.prevision_operaciones_48h",
              "backend.planificacion_48h",
              "backend.continuidad_baterias",
          ]

          for modulo in modulos:
              importlib.import_module(modulo)
              print("OK:", modulo)

          modelo = pulp.LpProblem(
              "prueba_cbc", pulp.LpMinimize
          )
          variable = modelo.add_variable(
              "x", lowBound=0
          )

          modelo += variable
          modelo += variable >= 1

          resultado = modelo.solve(
              pulp.COIN_CMD(msg=False)
          )

          if not resultado.has_solution:
              raise RuntimeError(
                  "CBC no ha resuelto la prueba"
              )

          print("CBC funcionando correctamente")
          PY

      # 6. Validar archivos iniciales
      - name: Comprobar datos necesarios
        shell: bash
        run: |
          FECHA=$(TZ=Europe/Madrid date +%F)
          DIA_INICIO=$(TZ=Europe/Madrid date -d "$FECHA +1 day" +%F)

          echo "FECHA=$FECHA" >> "$GITHUB_ENV"

          for archivo in \
            models/modelo_precio_hgb.joblib \
            data/processed/omie_ml_hourly.parquet \
            data/processed/omie_precios_actualizados.parquet \
            "data/processed/estado_baterias_${DIA_INICIO}.json"
          do
            if [ ! -s "$archivo" ]; then
              echo "::error::Falta el archivo: $archivo"
              exit 1
            fi
          done

          echo "Datos iniciales comprobados"
          echo "Fecha: $FECHA"

      # 7. Ejecutar pipeline diario
      - name: Generar plan diario
        shell: bash
        run: |
          PLAN="data/processed/planificacion_ml_48h_${FECHA}.parquet"

          if [ -f "$PLAN" ]; then
            echo "El plan ya existe. Se verificara."
          else
            python -m backend.pipeline_diario \
              --fecha-consulta "$FECHA"
          fi

      # 8. Verificar resultado generado
      - name: Validar planificacion
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import date, timedelta
          from pathlib import Path

          import pandas as pd

          fecha = date.fromisoformat(os.environ["FECHA"])
          texto = fecha.isoformat()
          base = Path("data/processed")

          ruta_plan = base / (
              f"planificacion_ml_48h_{texto}.parquet"
          )
          ruta_meta = base / (
              f"planificacion_ml_48h_{texto}.json"
          )
          ruta_estado = base / (
              "estado_baterias_"
              f"{(fecha + timedelta(days=2)).isoformat()}.json"
          )

          for ruta in (
              ruta_plan, ruta_meta, ruta_estado
          ):
              if not ruta.is_file():
                  raise FileNotFoundError(
                      f"Resultado incompleto: {ruta}"
                  )

          meta = json.loads(
              ruta_meta.read_text(encoding="utf-8")
          )
          estado = json.loads(
              ruta_estado.read_text(encoding="utf-8")
          )

          if (
              meta.get("fecha_consulta") != texto
              or meta.get("factibilidad_validada") is not True
          ):
              raise RuntimeError(
                  "La planificacion no esta validada"
              )

          if (
              estado.get("fecha_plan_origen") != texto
              or estado.get("tipo_estado")
              != "estimado_por_simulacion"
              or len(
                  estado.get("energia_inicial_vehiculos", {})
              ) != 50
          ):
              raise RuntimeError(
                  "Continuidad de baterias incorrecta"
              )

          inicio = pd.Timestamp(
              fecha + timedelta(days=1),
              tz="Europe/Madrid",
          )
          fin = pd.Timestamp(
              fecha + timedelta(days=3),
              tz="Europe/Madrid",
          )

          horas = pd.date_range(
              inicio.tz_convert("UTC"),
              fin.tz_convert("UTC"),
              freq="h",
              inclusive="left",
          )

          plan = pd.read_parquet(ruta_plan)

          marcas = pd.to_datetime(
              plan["datetime_utc"], utc=True
          )

          if (
              len(plan) != 50 * len(horas)
              or plan["vehicle_id"].nunique() != 50
              or plan.duplicated(
                  ["vehicle_id", "datetime_utc"]
              ).any()
              or set(marcas) != set(horas)
          ):
              raise RuntimeError(
                  "La matriz de planificacion esta incompleta"
              )

          print("PLAN VALIDADO")
          print("Fecha:", texto)
          print("Vehiculos: 50")
          print("Horas:", len(horas))
          print(
              "Coste estimado:",
              meta.get("coste_estimado_eur"),
          )
          PY

      # 9. Guardar resultados en GitHub
      - name: Publicar resultados
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          shopt -s nullglob

          archivos=(
            data/processed/omie_precios_actualizados.parquet
            data/processed/planificacion_ml_48h_*.parquet
            data/processed/planificacion_ml_48h_*.json
            data/processed/estado_baterias_*.json
            data/processed/prediccion_ml_48h_emitida_*.parquet
            data/processed/prediccion_ml_48h_emitida_*.json
            data/processed/prevision_operaciones_48h_emitida_*.parquet
            data/processed/prevision_operaciones_48h_emitida_*.json
          )

          if [ ${#archivos[@]} -gt 0 ]; then
            git add -f -- "${archivos[@]}"
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Actualizar planificacion diaria"
            git push origin HEAD:main
          else
            echo "No hay archivos nuevos."
          fi
